<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Барои Азимҷон</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #1877f2;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 16px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-top: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Салом, Азимҷон!</h1>
        <p>Ин саҳифа махсус барои ту сохта шудааст.</p>
        <img src="https://via.placeholder.com/400x400.png?text=Сурати+Азимҷон" alt="Сурати Азимҷон">
    </div>
</body>
</html>
